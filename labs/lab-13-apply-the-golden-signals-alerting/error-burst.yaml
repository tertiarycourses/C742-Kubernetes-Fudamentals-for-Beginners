apiVersion: batch/v1
kind: Job
metadata:
  name: error-burst
  namespace: kcna-lab
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: burst
        image: busybox:1.36
        command: ["sh","-c"]
        args:
        - |
          echo "Driving traffic hard for 3 minutes so the error ratio crosses 5%..."
          end=$(( $(date +%s) + 180 ))
          while [ $(date +%s) -lt $end ]; do
            wget -q -O- http://metrics-app.kcna-lab.svc.cluster.local:8080/metrics >/dev/null 2>&1
          done
          echo "Burst complete — check the Prometheus alerts API."
        resources:
          requests: { cpu: 50m, memory: 32Mi }
