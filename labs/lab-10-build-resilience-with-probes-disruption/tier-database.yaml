apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: db-data
  namespace: kcna-lab
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 512Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: database
  namespace: kcna-lab
  labels:
    tier: database
spec:
  replicas: 1
  strategy:
    type: Recreate            # a single RWO volume cannot be held by two Pods at once
  selector:
    matchLabels:
      app: db
      tier: database
  template:
    metadata:
      labels:
        app: db
        tier: database
    spec:
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: db-data
      containers:
      - name: db
        image: busybox:1.36
        command: ["sh","-c","echo started > /data/state; sleep 3600"]
        volumeMounts:
        - name: data
          mountPath: /data
        resources:
          requests: { cpu: 25m, memory: 32Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: kcna-lab
spec:
  selector:
    app: db
  ports:
  - port: 5432
    targetPort: 5432
