apiVersion: apps/v1
kind: Deployment
metadata:
  name: cpu-load
  namespace: kcna-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cpu-load
  template:
    metadata:
      labels:
        app: cpu-load
    spec:
      containers:
      - name: php-apache
        image: registry.k8s.io/hpa-example
        ports:
        - containerPort: 80
        resources:
          # The HPA computes utilisation as a PERCENTAGE OF THE REQUEST.
          # Without a CPU request the HPA has no denominator and cannot scale.
          requests:
            cpu: 200m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 128Mi
