apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cpu-load
  namespace: kcna-lab
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cpu-load
  minReplicas: 1
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50      # scale to keep average CPU at 50% of the request
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300   # wait 5 min before scaling down — avoids flapping
    scaleUp:
      stabilizationWindowSeconds: 0
