apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront
  namespace: kcna-lab
  labels:
    app: storefront
spec:
  replicas: 3
  selector:
    matchLabels:
      app: storefront
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: storefront
        tier: web
    spec:
      containers:
      - name: storefront
        image: nginx:1.27
        ports:
        - containerPort: 80
        volumeMounts:
        - name: catalog
          mountPath: /usr/share/nginx/html
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
      volumes:
      - name: catalog
        configMap:
          name: product-catalog
