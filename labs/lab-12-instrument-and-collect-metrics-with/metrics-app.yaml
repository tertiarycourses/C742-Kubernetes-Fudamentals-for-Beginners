apiVersion: v1
kind: ConfigMap
metadata:
  name: metrics-app-src
  namespace: kcna-lab
data:
  serve.py: |
    # A tiny exporter that emits all four Prometheus metric types.
    import http.server, random, time, threading

    START = time.time()
    STATE = {"orders": 0, "errors": 0, "queue": 0,
             "buckets": {0.1: 0, 0.25: 0, 0.5: 0, 1.0: 0, 2.5: 0},
             "sum": 0.0, "count": 0}

    def simulate():
        while True:
            STATE["orders"] += random.randint(1, 5)
            if random.random() < 0.08:
                STATE["errors"] += 1
            STATE["queue"] = random.randint(0, 25)
            latency = random.choice([0.05, 0.12, 0.3, 0.7, 1.8, 3.0])
            STATE["sum"] += latency
            STATE["count"] += 1
            for b in STATE["buckets"]:
                if latency <= b:
                    STATE["buckets"][b] += 1
            time.sleep(1)

    class H(http.server.BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path == "/healthz":
                self.send_response(200); self.end_headers(); self.wfile.write(b"ok"); return
            lines = [
                "# HELP orders_total Total orders processed.",
                "# TYPE orders_total counter",
                f"orders_total {STATE['orders']}",
                "# HELP errors_total Total failed requests.",
                "# TYPE errors_total counter",
                f"errors_total {STATE['errors']}",
                "# HELP queue_depth Current queue depth.",
                "# TYPE queue_depth gauge",
                f"queue_depth {STATE['queue']}",
                "# HELP request_duration_seconds Request latency.",
                "# TYPE request_duration_seconds histogram",
            ]
            cumulative = 0
            for b in sorted(STATE["buckets"]):
                cumulative += STATE["buckets"][b]
                lines.append(f'request_duration_seconds_bucket{{le="{b}"}} {cumulative}')
            lines += [
                f'request_duration_seconds_bucket{{le="+Inf"}} {STATE["count"]}',
                f"request_duration_seconds_sum {STATE['sum']:.3f}",
                f"request_duration_seconds_count {STATE['count']}",
                "# HELP process_uptime_seconds Uptime.",
                "# TYPE process_uptime_seconds gauge",
                f"process_uptime_seconds {time.time() - START:.0f}",
            ]
            body = ("\n".join(lines) + "\n").encode()
            self.send_response(200)
            self.send_header("Content-Type", "text/plain; version=0.0.4")
            self.end_headers(); self.wfile.write(body)
        def log_message(self, *a): pass

    threading.Thread(target=simulate, daemon=True).start()
    http.server.HTTPServer(("", 8080), H).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metrics-app
  namespace: kcna-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: metrics-app
  template:
    metadata:
      labels:
        app: metrics-app
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      volumes:
      - name: src
        configMap:
          name: metrics-app-src
      containers:
      - name: app
        image: python:3.12-slim
        command: ["python", "/src/serve.py"]
        ports:
        - containerPort: 8080
          name: metrics
        volumeMounts:
        - name: src
          mountPath: /src
        resources:
          requests: { cpu: 50m, memory: 64Mi }
          limits:   { cpu: 200m, memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: metrics-app
  namespace: kcna-lab
spec:
  selector:
    app: metrics-app
  ports:
  - port: 8080
    targetPort: 8080
