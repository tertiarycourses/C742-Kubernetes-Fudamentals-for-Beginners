apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: kcna-lab
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus-kcna
rules:
- apiGroups: [""]
  resources: ["nodes","nodes/proxy","services","endpoints","pods"]
  verbs: ["get","list","watch"]
- nonResourceURLs: ["/metrics"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus-kcna
subjects:
- kind: ServiceAccount
  name: prometheus
  namespace: kcna-lab
roleRef:
  kind: ClusterRole
  name: prometheus-kcna
  apiGroup: rbac.authorization.k8s.io
