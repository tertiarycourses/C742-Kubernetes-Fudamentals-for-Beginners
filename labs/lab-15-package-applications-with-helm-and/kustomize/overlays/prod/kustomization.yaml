apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: kcna-lab
nameSuffix: -prod

resources:
- ../../base

replicas:
- name: kustomize-web
  count: 5

images:
- name: nginx
  newTag: 1.27-alpine

commonLabels:
  environment: prod

# A strategic-merge patch — no templating language, just YAML overlaid on YAML.
patches:
- path: resources-patch.yaml
  target:
    kind: Deployment
    name: kustomize-web
