apiVersion: v1
kind: Pod
metadata:
  name: secret-consumer
  namespace: kcna-lab
  labels:
    app: frontend            # labelled so the allow-frontend NetworkPolicy matches it
spec:
  serviceAccountName: inventory-reader
  restartPolicy: Never
  containers:
  - name: app
    image: busybox:1.36
    command: ["sh", "-c"]
    args:
    - |
      echo "Connecting as: $DB_USERNAME@$DB_HOST:$DB_PORT/$DB_DATABASE"
      echo "Password length: ${#DB_PASSWORD} characters (never print the value itself)"
    env:
    - name: DB_USERNAME
      valueFrom:
        secretKeyRef: { name: db-credentials, key: username }
    - name: DB_PASSWORD
      valueFrom:
        secretKeyRef: { name: db-credentials, key: password }
    - name: DB_HOST
      valueFrom:
        secretKeyRef: { name: db-credentials, key: host }
    - name: DB_PORT
      valueFrom:
        secretKeyRef: { name: db-credentials, key: port }
    - name: DB_DATABASE
      valueFrom:
        secretKeyRef: { name: db-credentials, key: database }
    securityContext:
      runAsNonRoot: true
      runAsUser: 10001
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
