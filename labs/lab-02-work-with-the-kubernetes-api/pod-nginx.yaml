apiVersion: v1
kind: Pod
metadata:
  name: nginx
  namespace: kcna-lab
  labels:
    app: nginx
    tier: web
spec:
  containers:
  - name: nginx
    image: nginx:1.27
    ports:
    - containerPort: 80
      name: http
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
