apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: inventory
  namespace: kcna-lab
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
  - host: inventory.kcna.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: inventory
            port:
              number: 80
