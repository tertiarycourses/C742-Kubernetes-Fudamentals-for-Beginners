apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory
  namespace: kcna-lab
  labels:
    app: inventory
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory
  template:
    metadata:
      labels:
        app: inventory
        tier: api
    spec:
      containers:
      - name: inventory
        image: inventory-api:1.0
        imagePullPolicy: IfNotPresent    # the image was side-loaded with 'minikube image load'
        ports:
        - containerPort: 8080
          name: http
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 2
          periodSeconds: 5
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 300m
            memory: 192Mi
