apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-stable
  namespace: kcna-lab
spec:
  replicas: 9                 # 9 of 10 Pods => ~90% of traffic
  selector:
    matchLabels:
      app: app-canary
      track: stable
  template:
    metadata:
      labels:
        app: app-canary       # SHARED label — this is what the Service selects on
        track: stable         # distinguishing label, NOT in the Service selector
        version: v1
    spec:
      containers:
      - name: app
        image: nginx:1.27
        ports: [{ containerPort: 80 }]
        resources:
          requests: { cpu: 25m, memory: 32Mi }
