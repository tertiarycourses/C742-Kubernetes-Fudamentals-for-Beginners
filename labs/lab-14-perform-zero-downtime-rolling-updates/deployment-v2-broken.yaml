# A deliberately broken release: the image tag does not exist.
# The rollout will STALL rather than break the running version — that is the safety property.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-release
  namespace: kcna-lab
  annotations:
    kubernetes.io/change-cause: "v2 — BROKEN image tag (deliberate)"
spec:
  replicas: 4
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 60    # give up after 60s and report the failure
  selector:
    matchLabels:
      app: app-release
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: app-release
    spec:
      containers:
      - name: app
        image: nginx:this-tag-does-not-exist
        ports:
        - containerPort: 80
        readinessProbe:
          httpGet: { path: /, port: 80 }
          initialDelaySeconds: 2
          periodSeconds: 3
